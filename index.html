<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Teste Livechat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e5e7eb;
      }

      .box {
        background: #020617;
        padding: 32px;
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        max-width: 420px;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      p {
        font-size: 0.95rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>🚀 Livechat Teste</h1>
      <p>
        Esta página carrega o widget do Rocket.Chat
        <strong>sem iframe</strong>, evitando erro de CSP.
      </p>
      <p>O chat deve aparecer no canto da tela.</p>
    </div>

    <!-- Rocket.Chat Livechat (FORMA CORRETA) -->
    <script>
      (function (w, d, s, u) {
        w.RocketChat = function (c) {
          w.RocketChat._.push(c);
        };
        w.RocketChat._ = [];
        w.RocketChat.url = u;

        const h = d.getElementsByTagName(s)[0];
        const j = d.createElement(s);
        j.async = true;
        j.src = u + "/rocketchat-livechat.min.js";
        h.parentNode.insertBefore(j, h);
      })(window, document, "script", "http://localhost:3000/livechat");
    </script>

    <!-- Opcional: abrir automaticamente -->
    <script>
      RocketChat(function () {
        this.open();
        this.setVisitorName("Teste Local");
        this.setVisitorEmail("teste@localhost.dev");
      });
    </script>
  </body>
</html>
